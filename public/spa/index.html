        body {

            transform: scale(1.03);

        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            animation: fade-in 0.4s;

    </style>
</head>

<!-- Paieška -->
<!-- Paieška -->
<form id="searchForm" class="max-w-md mx-auto w-full flex items-center gap-2">

</form>



        </form>

        <!-- “Avatar” (paliktas kaip dizaino elementas) -->

            <!-- Nauji žaidimai -->

                <h2 class="text-2xl font-bold mb-6 text-[#00ffff]">Nauji žaidimai</h2>

        <!-- VIEW: GAMES LIST -->

        <!-- VIEW: GAME DETAIL -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

    <script>
        const API = {
            home: () => fetch('/api/home', { headers: { 'Accept': 'application/json' } }).then(r => r.json()),
            games: (params) => {
                const u = new URL(location.origin + '/api/games');
                Object.entries(params || {}).forEach(([k, v]) => { if (v !== '' && v != null) u.searchParams.set(k, String(v)); });
                return fetch(u.toString(), { headers: { 'Accept': 'application/json' } }).then(r => r.json());
            },
            game: (slug) => fetch('/api/games/' + encodeURIComponent(slug), { headers: { 'Accept': 'application/json' } }).then(r => r.json()),
        };

        const el = (id) => document.getElementById(id);

        function imgSrc(img) {
            if (!img) return '';
            if (img.startsWith('http://') || img.startsWith('https://')) return img;
            if (img.startsWith('/')) return img;
            return '/' + img;
        }

        function escapeHtml(str) {
            return (str ?? '').toString().replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        function showView(name) {
            el('view-home').classList.toggle('hidden', name !== 'home');
            el('view-games').classList.toggle('hidden', name !== 'games');
            el('view-game').classList.toggle('hidden', name !== 'game');
        }

        function linkTo(href) {
            history.pushState({}, '', href);
            router();
        }

        document.addEventListener('click', (e) => {
            const a = e.target.closest('a[data-link]');
            if (!a) return;
            e.preventDefault();
            linkTo(a.getAttribute('href'));
        });

        // Search -> /games?q=...
        el('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const q = el('default-search').value.trim();
            const u = new URL(location.origin + '/games');
            if (q) u.searchParams.set('q', q);
            linkTo(u.pathname + u.search);
        });

        // HOME render
        function cardHtml(g, href) {
            const platforms = (g.platforms && g.platforms.length) ? g.platforms.map(p => p.name).join(', ') : (g.platform ?? 'Nenurodyta');
            const name = escapeHtml(g.name);
            const price = escapeHtml(g.price);
            const img = imgSrc(g.image);

            return `
        <a href="${href}" data-link class="bg-[#1a1a1a] border border-[#333] rounded-lg overflow-hidden card-hover block hover:shadow-lg transition transform hover:-translate-y-1">
          <div class="w-full h-64 bg-black flex items-center justify-center">
            ${img ? `<img src="${img}" alt="${name}" class="max-h-full max-w-full object-contain" loading="lazy" />` : ``}
          </div>
          <div class="p-4">
            <h4 class="text-lg font-bold text-[#00ffff] truncate">${name}</h4>
            <p class="text-gray-400 text-sm mt-1">Platforma: ${escapeHtml(platforms)}</p>
            <p class="text-gray-300 mt-1">Kaina: <span class="text-[#00ffff] font-semibold">${price} €</span></p>
          </div>
        </a>
      `;
        }

        async function renderHome() {
            showView('home');
            const data = await API.home();

            const newGrid = el('home-new-grid');
            const popGrid = el('home-pop-grid');

            const newGames = data.new_games || [];
            const popGames = data.popular_games || [];

            newGrid.innerHTML = newGames.map(g => cardHtml(g, '/' + g.slug)).join('');
            popGrid.innerHTML = popGames.map(g => cardHtml(g, '/' + g.slug)).join('');
        }

        // GAMES list render (paginated)
        let currentPage = 1;
        let lastPage = 1;

        async function renderGames() {
            showView('games');

            const url = new URL(location.href);
            const q = url.searchParams.get('q') || '';
            const page = parseInt(url.searchParams.get('page') || '1', 10);

            el('default-search').value = q;

            const res = await API.games({ q, per_page: 20, page });
            const items = res.data || [];

            currentPage = res.current_page || page;
            lastPage = res.last_page || 1;

            el('games-grid').innerHTML = items.map(g => (
                `<a href="/${g.slug}" data-link class="block bg-[#181818] rounded-xl shadow-lg border border-[#2c2c2c] card-hover overflow-hidden">
          <div class="w-full h-64 bg-black flex items-center justify-center">
            ${g.image ? `<img src="${imgSrc(g.image)}" alt="${escapeHtml(g.name)}" class="max-h-full max-w-full object-contain" loading="lazy" />` : ``}
          </div>
          <div class="p-4">
            <h4 class="text-lg font-bold text-[#00ffff] truncate">${escapeHtml(g.name)}</h4>
            <p class="text-gray-400 text-sm mt-1">
              Platforma: ${(g.platforms && g.platforms.length) ? escapeHtml(g.platforms.map(p => p.name).join(', ')) : 'Nenurodyta'}
            </p>
            <p class="text-gray-300 mt-1">Kaina: <span class="text-[#00ffff] font-semibold">${escapeHtml(g.price)} €</span></p>
          </div>
        </a>`
            )).join('');

            el('games-page').textContent = `Puslapis ${currentPage} / ${lastPage}`;

            el('btn-prev').disabled = currentPage <= 1;
            el('btn-next').disabled = currentPage >= lastPage;
        }

        el('btn-prev').addEventListener('click', () => {
            if (currentPage <= 1) return;
            const u = new URL(location.href);
            u.searchParams.set('page', String(currentPage - 1));
            linkTo(u.pathname + u.search);
        });

        el('btn-next').addEventListener('click', () => {
            if (currentPage >= lastPage) return;
            const u = new URL(location.href);
            u.searchParams.set('page', String(currentPage + 1));
            linkTo(u.pathname + u.search);
        });

        // GAME detail render
        async function renderGame(slug) {
            showView('game');

            const g = await API.game(slug);

            el('game-title').textContent = g.name || '';
            el('game-price').textContent = (g.price ?? '') + ' €';

            const platforms = (g.platforms && g.platforms.length) ? g.platforms.map(p => p.name).join(', ') : 'Nenurodyta';
            const genres = (g.genres && g.genres.length) ? g.genres.map(x => x.name).join(', ') : 'Nenurodyta';

            el('game-platforms').textContent = platforms;
            el('game-genres').textContent = genres;

            const img = imgSrc(g.image || '');
            const imgEl = el('game-img');
            if (img) {
                imgEl.src = img;
                imgEl.alt = g.name || '';
                imgEl.classList.remove('hidden');
            } else {
                imgEl.classList.add('hidden');
            }

            const desc = g.description ? g.description : 'Aprašymo nėra.';
            el('game-desc').innerHTML = `<p>${escapeHtml(desc)}</p>`;
        }

        function router() {
            const path = location.pathname;
            const reserved = new Set(['', 'games', 'api', 'up']);

            // / -> HOME
            if (path === '/' || path === '') return renderHome();

            // /games -> LIST
            if (path === '/games') return renderGames();

            // /games/<slug> (jei kažkur liko)
            if (path.startsWith('/games/')) {
                const slug = path.split('/').filter(Boolean)[1];
                if (slug) return renderGame(slug);
            }

            // /<slug> -> DETAIL
            const slug = path.replace('/', '');
            if (slug && !reserved.has(slug)) return renderGame(slug);

            // fallback
            return renderHome();
        }

        window.addEventListener('popstate', router);
        router();


        document.getElementById('btn-export-xml').addEventListener('click', () => {
  const q = document.getElementById('default-search').value.trim();

  const u = new URL(location.origin + '/api/exports/games.xml');
  // Jei nori eksportuoti visus – palik be q.
  // Jei nori eksportuoti pagal paiešką – palik šitą:
  if (q) u.searchParams.set('q', q);

  window.location.href = u.toString(); // parsisiunčia XML
});

    </script>
</body>
